@let app = context();
<label class="season-field">
  {{ 'Saison' | t }}
  <select [ngModel]="app.runnerYear" [disabled]="app.runnerDetailLoading || !app.runnerSeasons.length"
          (ngModelChange)="app.runnerYear = $event; app.loadRunnerResults()">
    @for (year of app.runnerSeasons; track year) {
      <option [ngValue]="year">{{ year }}</option>
    }
  </select>
</label>
